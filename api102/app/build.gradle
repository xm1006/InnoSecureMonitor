plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.innotuidmonitor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.innotuidmonitor'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
}
